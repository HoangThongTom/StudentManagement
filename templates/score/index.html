{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    Score Management
</h2>

<!-- Search + Add -->

<div class="d-flex justify-content-between align-items-center mb-3">

    <form method="GET"
          action="{{ url_for('score.scores') }}"
          class="d-flex">

        <input
            type="text"
            name="keyword"
            class="form-control me-2"
            placeholder="Search Student ID or Class ID..."
            value="{{ keyword if keyword else '' }}">

        <button class="btn btn-primary">

            <i class="bi bi-search"></i>

            Search

        </button>

    </form>

    <a href="{{ url_for('score.add_score') }}"
       class="btn btn-success">

        <i class="bi bi-plus-circle"></i>

        Add Score

    </a>

</div>

<table class="table table-bordered table-hover shadow">

    <thead class="table-dark">

        <tr>

            <th>Student ID</th>
            <th>Class ID</th>
            <th>Score</th>
            <th>Rank</th>
            <th width="180">Action</th>

        </tr>

    </thead>

    <tbody>

    {% if scores %}

        {% for score in scores %}

        <tr>

            <td>{{ score.MaSV }}</td>

            <td>{{ score.MaLHP }}</td>

            <td>{{ score.DiemSo }}</td>

            <td>{{ score.XepLoai }}</td>

            <td>

                <a href="{{ url_for('score.edit_score',
                    masv=score.MaSV,
                    malhp=score.MaLHP) }}"
                    class="btn btn-warning btn-sm">

                    <i class="bi bi-pencil-square"></i>

                </a>

                <a href="{{ url_for('score.delete_score',
                    masv=score.MaSV,
                    malhp=score.MaLHP) }}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('Delete this score?')">

                    <i class="bi bi-trash"></i>

                </a>

            </td>

        </tr>

        {% endfor %}

    {% else %}

        <tr>

            <td colspan="5"
                class="text-center text-muted">

                No score found.

            </td>

        </tr>

    {% endif %}

    </tbody>

</table>

{% endblock %}
