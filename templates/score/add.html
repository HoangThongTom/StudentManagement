{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    Add Score
</h2>

<form method="POST">

    <!-- Student -->

    <div class="mb-3">

        <label class="form-label">
            Student
        </label>

        <select name="MaSV" class="form-select" required>

            {% for student in students %}

            <option value="{{ student.MaSV }}">

                {{ student.MaSV }} - {{ student.HoTen }}

            </option>

            {% endfor %}

        </select>

    </div>

    <!-- Classroom -->

    <div class="mb-3">

        <label class="form-label">
            Classroom
        </label>

        <select name="MaLHP" class="form-select" required>

            {% for classroom in classrooms %}

            <option value="{{ classroom.MaLHP }}">

                {{ classroom.MaLHP }}

            </option>

            {% endfor %}

        </select>

    </div>

    <!-- Score -->

    <div class="mb-3">

        <label class="form-label">
            Score
        </label>

        <input
            type="number"
            step="0.01"
            name="DiemSo"
            class="form-control"
            required>

    </div>

    <!-- Rank -->

    <div class="mb-3">

        <label class="form-label">
            Rank
        </label>

        <input
            type="text"
            name="XepLoai"
            class="form-control">

    </div>

    <button class="btn btn-success">

        <i class="bi bi-check-circle"></i>

        Save

    </button>

    <a href="{{ url_for('score.scores') }}"
       class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
