{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    Edit Score
</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Student ID
</label>

<input
type="text"
class="form-control"
value="{{ score.MaSV }}"
readonly>

</div>

<div class="mb-3">

<label class="form-label">
Class ID
</label>

<input
type="text"
class="form-control"
value="{{ score.MaLHP }}"
readonly>

</div>

<div class="mb-3">

<label class="form-label">
Score
</label>

<input
type="number"
step="0.01"
name="DiemSo"
class="form-control"
value="{{ score.DiemSo }}">

</div>

<div class="mb-3">

<label class="form-label">
Rank
</label>

<input
type="text"
name="XepLoai"
class="form-control"
value="{{ score.XepLoai }}">

</div>

<button class="btn btn-warning">

<i class="bi bi-pencil-square"></i>

Update

</button>

<a href="{{ url_for('score.scores') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

{% endblock %}
