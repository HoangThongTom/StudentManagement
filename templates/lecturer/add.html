{% extends "base.html" %}

{% block content %}

<h2>Add Lecturer</h2>

<form method="POST">

<div class="mb-3">
<label>Lecturer ID</label>
<input type="text" name="MaGV" class="form-control" required>
</div>

<div class="mb-3">
<label>Name</label>
<input type="text" name="TenGV" class="form-control" required>
</div>

<div class="mb-3">
<label>Department</label>
<input type="text" name="BoMon" class="form-control">
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="Email" class="form-control">
</div>

<div class="mb-3">
<label>Major</label>
<input type="text" name="ChuyenNganh" class="form-control">
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" name="SoDienThoai" class="form-control">
</div>

<button class="btn btn-success">
Save
</button>

<a href="{{ url_for('lecturer.lecturers') }}"
class="btn btn-secondary">
Cancel
</a>

</form>

{% endblock %}
